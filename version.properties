# Single source of truth for app versions. Bump these before every Play release;
# VERSION_CODE must always go up (Play rejects a code it has already seen).

# Phone app (:app)
VERSION_NAME=2.0.30
VERSION_CODE=37

# Wear OS app (:wear)
# Same applicationId as the phone app, so codes share one pool in Play and must never
# collide. Wear uses 100000+ (phone codes stay below that).
WEAR_VERSION_NAME=1.0.0
WEAR_VERSION_CODE=100001
